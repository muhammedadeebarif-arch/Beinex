<div
  class="modal-overlay"
  (click)="onCancel()"
  role="dialog"
  aria-modal="true"
  aria-labelledby="delete-title"
>
  <div class="modal-card" (click)="$event.stopPropagation()">
    <div class="delete-icon-wrapper">
      <div class="delete-icon">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <polyline points="3 6 5 6 21 6"></polyline>
          <path
            d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"
          ></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
      </div>
    </div>

    <h2 id="delete-title" class="delete-title">Confirm Deletion</h2>
    <p class="delete-desc">
      Are you sure you want to permanently delete this employee? This action cannot be undone.
    </p>

    <div class="emp-summary-card">
      <div class="emp-summary-name">{{ employee.name }}</div>
      <div class="emp-summary-email">{{ employee.email }}</div>
      <div class="emp-summary-meta">{{ employee.designation }} • {{ employee.department }}</div>
    </div>

    <div *ngIf="errorMessage" class="error-alert">
      {{ errorMessage }}
    </div>

    <div class="modal-actions">
      <button type="button" class="btn-secondary" (click)="onCancel()" [disabled]="isDeleting">
        Cancel
      </button>
      <button type="button" class="btn-danger" (click)="onConfirm()" [disabled]="isDeleting">
        <span *ngIf="isDeleting" class="spinner"></span>
        <span>{{ isDeleting ? 'Deleting...' : 'Delete Employee' }}</span>
      </button>
    </div>
  </div>
</div>
